name: Publish GHCR package

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build and push worker image"]
    types: [completed]

permissions:
  packages: write
  contents: read

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Make container package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG=minimax-h3-runpod

          echo "Package before:"
          gh api "/user/packages/container/$PKG"

          # REST: JSON body (form -f fails with 404 on this endpoint)
          echo '{"visibility":"public"}' | gh api --method PUT \
            "/user/packages/container/$PKG/visibility" \
            --input -

          echo "Package after:"
          gh api "/user/packages/container/$PKG" --jq '{name,visibility,html_url}'
